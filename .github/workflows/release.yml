name: Build plugin release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', 'Tag and package version differ'
          PY
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/build-plugin.py
      - run: python3 scripts/test-plugin.py
      - run: python3 scripts/test-install.py
      - run: python3 scripts/check-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.runner }}
          path: |
            target/plugins/*.zip
            target/plugins/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp scripts/install.sh release-assets/install.sh
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "Traversiq $RELEASE_TAG" --generate-notes
